name: School site CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: school-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node -v
          npm -v
          ls -la package.json package-lock.json
      - run: npm install --no-fund --no-audit
      - run: npm run lint
      - run: npm run build
        env:
          WORDPRESS_URL: https://www.nidomontessori.in/blog
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: amplify-output
          path: .output
          retention-days: 2

  deploy:
    name: Deploy to AWS Amplify
    needs: quality
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_REGION: ap-south-1
      AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: main
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: amplify-output
          path: .output

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload build to Amplify and wait until it finishes
        run: |
          set -euo pipefail
          if [ -z "${AMPLIFY_APP_ID}" ]; then
            echo "AMPLIFY_APP_ID secret is empty."
            exit 1
          fi
          sudo apt-get update -y
          sudo apt-get install -y zip
          (cd .output && zip -r ../amplify-deploy.zip .)
          CREATE=$(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH")
          JOB_ID=$(echo "$CREATE" | jq -r ".jobId")
          UPLOAD_URL=$(echo "$CREATE" | jq -r ".zipUploadUrl")
          echo "Uploading to Amplify job $JOB_ID"
          curl -sS -T amplify-deploy.zip "$UPLOAD_URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID"
          for i in $(seq 1 80); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query "job.summary.status" \
              --output text)
            echo "Amplify status: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Amplify deploy finished successfully."; exit 0 ;;
              FAILED|CANCELLED) echo "Amplify deploy $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Amplify job $JOB_ID"
          exit 1
